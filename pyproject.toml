[project]
name = "flashdrive"
version = "0.1.0"
description = "FlashDrive: an inference-only acceleration patch (streaming, DFlash speculative decoding, W4A8/PARO quantization) applied on top of the external Alpamayo VLA models."
readme = "README.md"
license = "MIT"
authors = [{ name = "Z Lab" }]
requires-python = "==3.12.*"
dependencies = [
  # External Alpamayo model packages that FlashDrive patches at runtime.
  "alpamayo1_5 @ git+https://github.com/NVlabs/alpamayo1.5",
  "alpamayo_r1 @ git+https://github.com/NVlabs/alpamayo",
  # Runtime deps used directly by the patch code.
  "einops>=0.8.1",
  "numpy>=2.2.0",
  "torch==2.9.1",
  "transformers==4.57.1",
  "vllm==0.16.0",
  # PhysicalAI-AV dataset interface, imported by scripts/infer.py.
  "physical-ai-av>=0.2.0",
  # Faster HF downloads, opt-in via HF_HUB_ENABLE_HF_TRANSFER=1 (not imported).
  "hf_transfer==0.1.9",
  # Rotation CUDA kernel for W4A8 (registers torch.ops.rotation.rotate, JIT-built
  # on first use). Pure-Python wheel, so it installs via uv sync.
  "paroquant==0.1.15",
]

[project.urls]
Repository = "https://github.com/z-lab/flashdrive"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flashdrive*"]

[tool.setuptools.package-data]
flashdrive = ["py.typed"]

[dependency-groups]
dev = [
  "ruff>=0.9.0",
]

[tool.uv]
# The external Alpamayo packages pin torch==2.8.0; override so the project's
# torch==2.9.1 wins and `uv lock`/`uv sync` resolve cleanly. Targets CUDA 12.8.
override-dependencies = [
  "torch==2.9.1",
  # FlashDrive is all-sdpa; drop the alpamayo-declared flash-attn (unused,
  # and a slow/RAM-heavy source build). Never-true marker excludes it.
  "flash-attn; platform_system == 'FlashDriveNever'",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pyflakes (F) + import sorting (I) + default pycodestyle (E4/E7/E9)
# + bugbear (B) + pyupgrade (UP) + logging best practices (LOG, G).
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "LOG", "G"]

[tool.ruff.format]
# Defaults: double quotes, line-length from [tool.ruff].
